# nginx del frontend: sirve la SPA y hace proxy del API y de las imagenes
# al backend (mismo origen para el navegador, sin problemas de CORS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API del backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # Fotos subidas por los usuarios
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Imagenes estaticas del catalogo (servidas por Spring desde resources/static)
    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA: cualquier otra ruta devuelve index.html (react-router se encarga)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
