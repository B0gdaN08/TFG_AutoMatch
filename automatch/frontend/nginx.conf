# nginx del frontend: sirve la SPA y hace proxy del API y de las imagenes
# al backend (mismo origen para el navegador, sin problemas de CORS).

# Esquema real de la peticion: si venimos de otro proxy (Cloudflare, un tunel,
# un balanceador TLS) respetamos su X-Forwarded-Proto; si el cliente conecta
# directo a este nginx, usamos el esquema de la conexion. Sin esto, el backend
# creeria que las peticiones https del tunel son http y las rechazaria como
# CORS de otro origen (403 "Invalid CORS request").
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras comunes de proxy ($http_host conserva el puerto, necesario
    # para que el backend reconstruya el origen exacto de la peticion)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # API del backend
    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 6m;
    }

    # Fotos subidas por los usuarios
    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # Imagenes estaticas del catalogo (servidas por Spring desde resources/static)
    location /images/ {
        proxy_pass http://backend:8080;
    }

    # SPA: cualquier otra ruta devuelve index.html (react-router se encarga)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
