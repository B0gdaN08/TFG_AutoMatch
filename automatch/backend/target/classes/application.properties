spring.application.name=automatch

# --- Base de datos H2 en fichero (se crea sola en backend/data/) ---
spring.datasource.url=jdbc:h2:file:./data/automatch;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# En produccion DEBE definirse la variable de entorno APP_JWT_SECRET con una clave
# larga y aleatoria; el valor por defecto solo es valido para desarrollo local.
app.jwt.secret=${APP_JWT_SECRET:cambiame-por-una-clave-larga-y-secreta-automatch-tfg-2026-urjc!!}
app.jwt.expiration-ms=86400000

server.port=8080

# --- Subida de fotos de coches ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Usuarios de prueba (DataLoader) ---
# En produccion deben sobrescribirse con variables de entorno propias.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:demo123}
