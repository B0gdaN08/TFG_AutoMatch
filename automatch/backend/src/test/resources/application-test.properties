spring.application.name=automatch-test

# --- H2 en memoria: SOLO para tests ---
# La aplicacion usa PostgreSQL (dev y prod); los tests usan H2 en memoria por
# velocidad y para que `mvn verify` no dependa de servicios externos. Las
# migraciones Flyway son SQL compatible con ambos motores y se ejecutan
# tambien aqui, de modo que la suite valida que coinciden con las entidades.
spring.datasource.url=jdbc:h2:mem:automatch-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT (clave de test, no usar en produccion) ---
app.jwt.secret=clave-de-test-automatch-1234567890-abcdefghijklmnop
app.jwt.expiration-ms=3600000

# --- CORS ---
app.cors.origins=http://localhost:5173

server.port=0

# --- Subida de fotos de coches (carpeta de test) ---
app.upload-dir=target/test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Usuarios de prueba (DataLoader) ---
app.seed.admin-password=admin123
app.seed.demo-password=demo123
