spring.application.name=automatch-test

# --- Base de datos H2 en memoria para tests (no toca la BD de desarrollo) ---
spring.datasource.url=jdbc:h2:mem:automatch-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# --- JWT (clave de test, no usar en produccion) ---
app.jwt.secret=clave-de-test-automatch-1234567890-abcdefghijklmnop
app.jwt.expiration-ms=3600000

server.port=0

# --- Subida de fotos de coches (carpeta de test) ---
app.upload-dir=target/test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Usuarios de prueba (DataLoader) ---
app.seed.admin-password=admin123
app.seed.demo-password=demo123
