# === Perfil de PRODUCCION ===
# Activar con SPRING_PROFILES_ACTIVE=prod. Todas las credenciales vienen del entorno.

# --- PostgreSQL via variables de entorno ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Detras de un reverse proxy (nginx, Render...): honrar X-Forwarded-Proto/Host ---
# Sin esto, Spring cree que la peticion llego por http al host interno y trata las
# peticiones del propio frontend como CORS de otro origen -> 403 "Invalid CORS request".
# Tomcat solo confia en estas cabeceras cuando vienen de proxies de red interna.
server.forward-headers-strategy=native

# --- JWT: obligatorio definir APP_JWT_SECRET (sin valor por defecto: si falta, no arranca) ---
app.jwt.secret=${APP_JWT_SECRET}

# --- CORS configurable (lista separada por comas) ---
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}

# --- Swagger / OpenAPI desactivados en produccion ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
