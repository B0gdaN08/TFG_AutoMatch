spring.application.name=automatch

# Perfil por defecto: desarrollo (PostgreSQL local). Para produccion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# --- JPA ---
# El esquema lo gestiona Flyway (db/migration); Hibernate solo valida que coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.expiration-ms=86400000

server.port=8080

# --- Subida de fotos de coches ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Usuarios de prueba (fallback del DataLoader si la BD no tiene usuarios) ---
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:demo123}
