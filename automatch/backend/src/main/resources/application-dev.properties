# --- Base de datos H2 en fichero (se crea sola en backend/data/) ---
spring.datasource.url=jdbc:h2:file:./data/automatch;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT: clave por defecto SOLO valida para desarrollo local ---
app.jwt.secret=${APP_JWT_SECRET:cambiame-por-una-clave-larga-y-secreta-automatch-tfg-2026-urjc!!}

# --- CORS: frontend de Vite en desarrollo ---
app.cors.origins=http://localhost:5173
