# ============================================================
# AutoMatch en produccion local: PostgreSQL + backend + frontend
#
#   1) cp .env.example .env   (y cambia APP_JWT_SECRET)
#   2) docker compose up --build
#   3) abre http://localhost:5173
# ============================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: automatch
      POSTGRES_USER: automatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automatch}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automatch -d automatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/automatch
      SPRING_DATASOURCE_USERNAME: automatch
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-automatch}
      # Obligatorio: sin APP_JWT_SECRET el backend no arranca (definir en .env)
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Falta APP_JWT_SECRET - copia .env.example a .env y define una clave}
      APP_CORS_ORIGINS: http://localhost:5173
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ==========================================================================
  # Servicios SOLO de desarrollo (docker compose --profile dev up -d)
  # ==========================================================================

  # PostgreSQL para `mvn spring-boot:run` (perfil dev de Spring).
  # Credenciales fijas de desarrollo; datos en su propio volumen.
  db-dev:
    image: postgres:16
    profiles: ["dev"]
    environment:
      POSTGRES_DB: automatch
      POSTGRES_USER: automatch
      POSTGRES_PASSWORD: automatch
    ports:
      - "5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automatch -d automatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interfaz web para inspeccionar la BD de desarrollo (http://localhost:8081)
  # Sistema: PostgreSQL · Servidor: db-dev · Usuario/contraseña/BD: automatch
  adminer:
    image: adminer
    profiles: ["dev"]
    ports:
      - "8081:8080"
    depends_on:
      - db-dev

volumes:
  db-data:
  db-dev-data:
  uploads:
